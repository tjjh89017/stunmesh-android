name: Release

# A pushed tag publishes a signed, installable APK as a GitHub release asset.
# Signed because Android refuses to install an unsigned APK, and with the same
# key every time because Android only upgrades an app in place when the new APK
# carries the signature the installed one was signed with.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The tag names the release; run_number is the versionCode, monotonic
      # across runs of this workflow as versionCode must be. See main.yml for
      # why the version comes from the workflow context and not from git.
      - name: Version
        run: |
          echo "VERSION_NAME=${{ github.ref_name }}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      # debug is the only variant with unit tests: AGP builds them for the test
      # build type alone, so there is no testReleaseUnitTest task.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      # Decoded to the runner's temp dir, never into the workspace, so it can't
      # be picked up as a build input or uploaded with the artifacts.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set; a release APK must be signed"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      # Fails loudly rather than shipping the -unsigned APK: an absent signing
      # config makes assembleRelease succeed with a different file name.
      - name: Name the asset
        run: |
          apk=app/build/outputs/apk/release/stunmesh-android-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::$apk missing — the build produced no signed APK"
            ls -l app/build/outputs/apk/release/
            exit 1
          fi
          asset="stunmesh-android-${{ github.ref_name }}.apk"
          cp "$apk" "$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      # A tag with a suffix (v0.1.0-rc1) publishes as a prerelease. Uploading
      # with --clobber on an existing release keeps a re-run idempotent.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ github.ref_name }}
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ASSET" --clobber
          else
            prerelease=
            case "$tag" in *-*) prerelease=--prerelease ;; esac
            gh release create "$tag" "$ASSET" \
              --title "$tag" --generate-notes --verify-tag $prerelease
          fi
