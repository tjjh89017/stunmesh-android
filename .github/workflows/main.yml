name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Version from the workflow context rather than git, so the checkout can
      # stay shallow: git describe would need the tags and rev-list --count the
      # whole history. run_number is monotonic, which versionCode must be.
      - name: Version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION_NAME=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: stunmesh-android-debug
          path: app/build/outputs/apk/debug/stunmesh-android-debug.apk
